# This is a Databricks asset bundle definition for ETLFlows.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: ETLFlows
  uuid: d43bc9c9-aaaf-4ff5-9a5d-89ce2bc9e5c4

include:
  - resources/*.yml
  - resources/*/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    presets:
      name_prefix: dev_${workspace.current_user.short_name}
      source_linked_deployment: false

    workspace:
      host: http://127.0.0.1:7073
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    presets:
      name_prefix: prod_${workspace.current_user.short_name}
      source_linked_deployment: false
    workspace:
      host: http://127.0.0.1:7073
      # We explicitly deploy to /Workspace/Users/rahul.soni@inkeysolutions.com to make sure we only have a single copy.
      root_path: /Workspace/Users/rahul.soni@inkeysolutions.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - group_name: admins
        level: CAN_MANAGE
